name: test

# Runs the test suites on every push to master and every PR. The escape suite
# runs on all three OSes so cross-platform regressions (native better-sqlite3,
# the Windows script portability fixed in #11/#12) are caught automatically.

on:
  push:
    branches: [master]
  pull_request:

# A newer push to the same ref supersedes an in-flight run.
concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The docs ARE the website, so a dead link or an oversized page is a build
  # failure here rather than a surprise on souspli.org. Standalone package:
  # nothing from the app is installed.
  site:
    name: docs + site
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site/package-lock.json
      - run: npm ci
      - run: npm run build

  # relay.souspli.org. Standalone like the site. The integration step runs the
  # real Worker and its Durable Object in workerd and drives them over
  # WebSockets -- the closest thing to production that fits in CI.
  relay:
    name: relay
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: relay
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: relay/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run test:integration

  unit:
    name: unit + typecheck
    runs-on: ubuntu-latest
    # id-token: the Codecov upload authenticates with GitHub's OIDC token, so
    # there is no upload secret to store or leak.
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
        with:
          version: 11
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test:coverage
      # Pinned to a commit, not a tag: this is the one third-party action here
      # that runs with an identity token, and a tag can be moved. v7.1.1.
      # Forks can't mint the token, so their upload fails without failing CI.
      - uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5
        with:
          use_oidc: true
          files: coverage/lcov.info
          disable_search: true
          fail_ci_if_error: false

  cage:
    name: escape suite (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
        with:
          version: 11
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22
          cache: pnpm

      # Headless Linux needs a virtual X server; the test launcher
      # (scripts/run-cage-tests.mjs) auto-detects and uses it. macOS/Windows
      # runners have a native display server and need nothing.
      - name: Install xvfb (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y xvfb

      - run: pnpm install --frozen-lockfile

      # DIAGNOSTIC: a shell that dies mid-test surfaces only as "Target page,
      # context or browser has been closed", which says nothing about whether
      # it crashed, was signalled, or quit cleanly — and there is a Windows-only
      # failure (poster.spec.ts:201, twice) that looks exactly like that. Both
      # the app and the harness already write to SHELL_EXIT_LOG; it was simply
      # never switched on, so every occurrence has been undiagnosable after the
      # fact. Costs nothing when nothing dies.
      - name: Run the escape suite
        run: pnpm test:cage
        env:
          SHELL_EXIT_LOG: ${{ runner.temp }}/shell-exits.jsonl

      # ALWAYS, not just on failure. A process can crash without failing a
      # test -- two Windows apps exited 0xC0000005 during teardown while the
      # suite went green -- and that is invisible unless the log is kept for
      # passing runs too. It is ~20 KB.
      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: diagnostics-${{ matrix.os }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/shell-exits.jsonl
            test-results/
          retention-days: 14
          if-no-files-found: ignore
