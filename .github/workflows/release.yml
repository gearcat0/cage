name: release

# Build Souspli's installers for macOS, Windows, and Linux, and attach them to
# a GitHub Release. Triggered by pushing a version tag (v*), or manually.
#
#   git tag v0.1.0 && git push origin v0.1.0
#
# macOS .dmg can ONLY be built on a Mac, Windows .exe is most reliable on
# Windows, so each platform builds on its own runner (a matrix).
#
# macOS is signed and notarized here, from the `release` environment's
# secrets, and that environment requires the maintainer's approval before any
# job can see them. Windows is NOT signed here: the Certum key lives in
# SimplySign's cloud HSM behind a phone OTP, so the maintainer builds and signs
# it locally (`pnpm dist:win:signed`) and attaches it to the draft. The Windows
# job below is an unsigned build check only; its files never reach the Release.
# See docs/how/develop/building.md for the runbook.

on:
  push:
    tags: ['v*']
  workflow_dispatch: {} # manual runs produce artifacts but no Release

permissions:
  contents: write # the release job needs to create/attach to a Release

jobs:
  build:
    environment: release
    # A build takes 10–30 minutes, but Apple's notarization of arm64 builds has
    # sat for hours (see electron-builder.yml). 360 is GitHub's maximum for a
    # hosted job; past it the run fails rather than hangs.
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        include:
          # latest*.yml and the blockmaps are the update feed: without them an
          # installed copy cannot see the release.
          - os: macos-latest
            platform: mac
            artifact: installers-mac
            artifacts: |
              release/*.dmg
              release/*.zip
              release/latest-mac.yml
              release/*.blockmap
          - os: windows-latest
            platform: win
            artifact: unsigned-check-win # not attached to the Release
            artifacts: 'release/*.exe'
          - os: ubuntu-latest
            platform: linux
            artifact: installers-linux
            artifacts: |
              release/*.AppImage
              release/*.deb
              release/latest-linux.yml
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
        with:
          version: 11

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22
          cache: pnpm

      # better-sqlite3 compiles natively on install. The runners ship the needed
      # toolchains (Xcode CLT on macOS, VS Build Tools on Windows, gcc on Linux),
      # so no extra setup is required.
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build (main / preload / renderer)
        run: pnpm build

      # APPLE_API_KEY is a PATH to the App Store Connect key, not its contents.
      - name: Apple credentials (macOS)
        if: matrix.platform == 'mac'
        run: |
          if [ -z "$CSC_LINK" ] || [ -z "$APPLE_API_KEY_P8" ]; then
            echo "::error::The release environment is missing MAC_CSC_LINK or APPLE_API_KEY_P8; an unsigned Mac build cannot update."
            exit 1
          fi
          printf '%s' "$APPLE_API_KEY_P8" > "$RUNNER_TEMP/AuthKey.p8"
        env:
          CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}

      - name: Package installers (macOS, signed + notarized)
        if: matrix.platform == 'mac'
        run: pnpm exec electron-builder --mac --publish never
        env:
          CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
          APPLE_API_KEY: ${{ runner.temp }}/AuthKey.p8
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}

      - name: Package installers (${{ matrix.platform }}, unsigned)
        if: matrix.platform != 'mac'
        run: pnpm exec electron-builder --${{ matrix.platform }} --publish never
        env:
          # No certificate here: don't let electron-builder go looking for one.
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - name: Upload installers
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifacts }}
          if-no-files-found: error
          retention-days: 14

  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v') # only tag pushes cut a Release
    steps:
      - name: Download the installers
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          path: installers
          pattern: installers-* # not the unsigned Windows check
          merge-multiple: true

      - name: Create / update the GitHub Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          files: installers/**/*
          draft: true # publish manually after a smoke check
          generate_release_notes: true
          body: |
            **Experimental alpha.**
            - **macOS** — signed and notarized. Apple Silicon (`arm64`) and Intel (`x64`).
            - **Windows** — signed. SmartScreen may still warn until the certificate
              builds reputation: More info → Run anyway.
            - **Linux** — `chmod +x Souspli-*.AppImage` then run (it updates itself);
              or install the `.deb` (you'll be told about new versions).

            Souspli asks before it checks for updates, and again before downloading one.

            Your identity key is stored in **software** on your device. Do not use
            it for anything valuable. See the in-app safety notice.
