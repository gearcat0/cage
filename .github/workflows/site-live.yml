name: site-live

# What visitors RECEIVE, as opposed to what we built. The build gate in test.yml
# cannot see what a CDN does to the HTML afterwards; this fetches souspli.org the
# way a browser does and fails on anything unexpected in the served pages.
# (Cloudflare's own Web Analytics beacon is expected and allowed.)

on:
  schedule:
    - cron: '17 6 * * *' # daily; a dashboard toggle can change this with no commit
  workflow_dispatch:
  push:
    branches: [master]
    paths: ['site/**', 'docs/**']

jobs:
  live:
    name: deployed site
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22
      # A push triggers the Pages build too; give it time to go live first.
      - if: github.event_name == 'push'
        run: sleep 240
      - run: node site/scripts/check-live.mjs
