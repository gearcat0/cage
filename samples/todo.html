<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<title>todo</title>
<style>
  body { margin: 0; font: 15px/1.5 system-ui, sans-serif; background: #1d2320; color: #22301f;
         display: flex; align-items: flex-start; justify-content: center; min-height: 100vh; padding: 28px; box-sizing: border-box; }
  .card { background: #fff; border: 1px solid #d5dbd0; border-radius: 10px; width: 26em; max-width: 100%;
          padding: 20px 22px 22px; box-shadow: 0 4px 14px rgba(30, 50, 25, .12); }
  h1 { margin: 0 0 4px; font-size: 20px; }
  .count { margin: 0 0 14px; font-size: 12px; color: #6d7a66; }
  ul { list-style: none; margin: 0; padding: 0; }
  li { display: flex; gap: 8px; align-items: center; padding: 6px 0; border-bottom: 1px solid #eef1ec; }
  li.done .text { text-decoration: line-through; color: #98a291; }
  .text { flex: 1; }
  input[type='text'] { font: inherit; flex: 1; border: 1px solid #ccd4c6; border-radius: 4px; padding: 4px 8px; }
  #edit-title { width: 100%; box-sizing: border-box; font-size: 18px; font-weight: 600; margin-bottom: 12px; }
  button { font: inherit; border: 0; border-radius: 4px; cursor: pointer; }
  .del { background: none; color: #b0b8a9; padding: 0 6px; font-size: 16px; }
  .del:hover { color: #c0392b; }
  .add { margin-top: 12px; background: #4a7c3f; color: #fff; padding: 6px 14px; }
  .empty { color: #98a291; padding: 10px 0; }
  .note { margin-top: 12px; font-size: 12px; color: #98a291; }
</style>
</head>
<body>
  <div class="card">
    <div id="app"></div>
  </div>
  <script>
    'use strict';
    // ARRAY state through the draft contract: args {title, items: [{text,
    // done}]}. View mode is the signed artifact, read-only — checking things
    // off is editing, so it happens in edit mode and becomes real when the
    // human publishes. As always: the program renders the shell-chosen mode
    // and streams every change on the draft channel; all controls that grant
    // anything are the shell's.
    var a = window.bridge.getArgs() || {};
    var args = (a && typeof a.args === 'object' && a.args !== null) ? a.args : {};
    var app = document.getElementById('app');

    function str(v) { return typeof v === 'string' ? v : ''; }

    function cleanItems(raw) {
      if (!Array.isArray(raw)) return [];
      return raw.map(function (it) {
        it = (it && typeof it === 'object') ? it : {};
        return { text: str(it.text), done: it.done === true };
      });
    }

    function el(tag, text) {
      var e = document.createElement(tag);
      if (text !== undefined) e.textContent = text;
      return e;
    }

    function countLine(items) {
      var done = items.filter(function (it) { return it.done; }).length;
      return done + ' of ' + items.length + ' done';
    }

    function viewMode() {
      var items = cleanItems(args.items);
      app.replaceChildren();
      var title = el('h1', str(args.title) || '—'); title.id = 'view-title';
      var count = el('p', countLine(items)); count.className = 'count'; count.id = 'view-count';
      app.append(title, count);
      if (items.length === 0) {
        var empty = el('div', 'Nothing on the list.'); empty.className = 'empty'; empty.id = 'view-empty';
        app.append(empty);
        return;
      }
      var ul = el('ul'); ul.id = 'view-items';
      items.forEach(function (it, i) {
        var li = el('li'); li.id = 'view-item-' + i;
        if (it.done) li.className = 'done';
        var box = el('span', it.done ? '☑' : '☐');
        var text = el('span', it.text || '—'); text.className = 'text';
        li.append(box, text);
        ul.append(li);
      });
      app.append(ul);
    }

    function editMode() {
      var items = cleanItems(args.items);
      var title = el('input'); title.type = 'text'; title.id = 'edit-title';
      title.value = str(args.title); title.placeholder = 'List title';

      function streamDraft() {
        window.bridge.emit('draft', {
          type: 'todo',
          args: { title: title.value.trim(), items: items }
        });
      }

      function render() {
        app.replaceChildren();
        app.append(title);
        var ul = el('ul'); ul.id = 'edit-items';
        items.forEach(function (it, i) {
          var li = el('li');
          var box = el('input'); box.type = 'checkbox'; box.id = 'item-done-' + i; box.checked = it.done;
          box.addEventListener('change', function () { it.done = box.checked; streamDraft(); });
          var text = el('input'); text.type = 'text'; text.id = 'item-text-' + i; text.value = it.text;
          text.placeholder = 'Something to do…';
          text.addEventListener('input', function () { it.text = text.value; streamDraft(); });
          var del = el('button', '×'); del.className = 'del'; del.id = 'item-del-' + i; del.title = 'Remove';
          del.addEventListener('click', function () { items.splice(i, 1); streamDraft(); render(); });
          li.append(box, text, del);
          ul.append(li);
        });
        app.append(ul);
        var add = el('button', '+ Add item'); add.className = 'add'; add.id = 'add-item';
        add.addEventListener('click', function () {
          items.push({ text: '', done: false });
          streamDraft();
          render();
          var input = document.getElementById('item-text-' + (items.length - 1));
          if (input) input.focus();
        });
        var note = el('div', 'Preview in View — publish from the shell header when you’re ready.');
        note.className = 'note';
        app.append(add, note);
      }

      title.addEventListener('input', streamDraft);
      render();
      streamDraft(); // initial state, so the shell's Publish enables immediately
      title.focus();
    }

    if (a.mode === 'edit') editMode(); else viewMode();
  </script>
</body>
</html>
