# electron-builder — installers for Souspli (in the code: the shell, the trusted client).
#
# The packaged app launches the shell: package.json `main` is
# out/main/shell/main.js (so `electron .`, `pnpm start`, `pnpm dev`, and the
# installer all agree). The legacy cage harness (out/main/index.js) is launched
# only by `pnpm dev:cage`. We deliberately DO NOT use `extraMetadata.main` — with
# the app dir at the repo root, electron-builder rewrites the source package.json
# in place to apply it (stripping scripts/devDeps) and does not always restore
# it. Keeping `main` correct at the source avoids that footgun entirely.
#
# Native module: better-sqlite3 is compiled per-platform. `npmRebuild: true`
# (the default) rebuilds it against the TARGET Electron ABI during packaging, so
# each installer ships a module matching its own Electron — testers need no
# toolchain. It is unpacked from the asar (a .node cannot be loaded from inside).
#
# Signing: macOS is signed and notarized in CI (release.yml, from secrets).
# Windows is signed on the maintainer's machine, because the Certum key is in
# SimplySign's cloud HSM behind a phone OTP: `pnpm dist:win:signed` (see
# scripts/dist-win-signed.mjs and docs/how/develop/building.md). Signing
# happens inside electron-builder so latest.yml's hashes describe the signed
# files; signing afterwards would break every update's integrity check.

# appId is the update + signing identity. Changing it after a signed release
# strands every installed copy, so it is settled here, before the first one.
appId: org.souspli.app
productName: Souspli
executableName: souspli
artifactName: Souspli-${version}-${os}-${arch}.${ext}
copyright: © 2026 Souspli contributors

directories:
  output: release
  buildResources: build

# What goes in the app. The vite build bundles @noble/* and zod INTO out/main.
# Runtime node_modules are the production dependencies it keeps external:
# better-sqlite3 (native), webtorrent, and electron-updater.
files:
  - out/**/*
  - package.json
  - '!**/*.map'
  - '!**/*.ts'

# Double-clicking a .thing opens it in the shell (it still goes through the
# same admission gate — arriving by double-click grants a bundle nothing).
fileAssociations:
  - ext: thing
    name: Souspli letter
    description: A signed Souspli letter
    mimeType: application/x-thing
    role: Viewer

asar: true
asarUnpack:
  - '**/node_modules/better-sqlite3/**'

npmRebuild: true

# ── macOS ────────────────────────────────────────────────────────────────────
mac:
  # Both architectures in ONE job, so one latest-mac.yml lists both and each
  # Mac is offered its own. The zip is what the updater downloads.
  target:
    - target: dmg
      arch: [x64, arm64]
    - target: zip
      arch: [x64, arm64]
  category: public.app-category.social-networking
  icon: build/icon.png
  # Signed with the Developer ID from CSC_LINK and notarized whenever the
  # APPLE_API_KEY* variables are set (release.yml). Hardened runtime is on by
  # default, with electron-builder's bundled entitlements. Squirrel.Mac will
  # only install an update signed by the same Developer ID.
  darkModeSupport: true

# ── Windows ──────────────────────────────────────────────────────────────────
win:
  target:
    - target: nsis
      arch: [x64]
  icon: build/icon.png
  signtoolOptions:
    # The updater installs a downloaded update only if it is signed by this
    # name. Set explicitly: when electron-builder does not sign with a
    # certificate of its own, it cannot derive this, and electron-updater
    # 6.x then SKIPS the check. The subject CN alone survives renewals; if the
    # name ever changes, first ship a release listing both.
    # scripts/dist-win-signed.mjs refuses to build while this is unset.
    publisherName: REPLACE_WITH_CERTUM_SUBJECT_CN
    # Timestamped, so signatures stay valid after the 1-year cert expires.
    rfc3161TimeStampServer: http://time.certum.pl
    signingHashAlgorithms: [sha256]
    # certificateSha1 (the SimplySign cert's thumbprint) is passed by
    # scripts/dist-win-signed.mjs from SOUSPLI_WIN_CERT_SHA1: it changes at
    # every renewal and only exists on a machine logged in to SimplySign.

nsis:
  oneClick: false # let the tester choose the install dir
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true

# ── Linux ────────────────────────────────────────────────────────────────────
linux:
  target:
    - AppImage
    - deb
  category: Network
  icon: build/icon.png
  maintainer: gearcat0 <large.oil2707@fastmail.com>
  synopsis: Signed, self-contained letters exchanged between people, with no server in the middle

# The update feed. This makes electron-builder write app-update.yml into the
# app and latest*.yml + blockmaps beside the installers. It publishes nothing
# by itself: CI runs with --publish never and attaches the files to a DRAFT
# Release, which updaters cannot see until it is published by hand.
publish:
  provider: github
  owner: souspli
  repo: souspli
