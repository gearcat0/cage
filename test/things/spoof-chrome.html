<script>
  const r = { attack: 'spoof-chrome' };
  r.before = { innerH: innerHeight, outerH: outerHeight, screenY: screenY };
  try { window.resizeTo(2000, 2000); } catch (e) { r.resizeThrew = String(e); }
  try { window.moveTo(-100, -100); } catch (e) { r.moveThrew = String(e); }
  try { document.documentElement.requestFullscreen && document.documentElement.requestFullscreen(); }
  catch (e) { r.fsThrew = String(e); }
  setTimeout(() => {
    r.after = { innerH: innerHeight, outerH: outerHeight, screenY: screenY };
    window.bridge.emit('done', r);
