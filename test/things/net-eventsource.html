<!doctype html>
<meta charset="utf-8" />
<title>attack: EventSource</title>
<!-- ATTACK: open a Server-Sent-Events stream to a canary. connect-src 'none'
     forbids it; no socket may open. Canary must stay silent. -->
<script>
  const canary = ((window.bridge.getArgs() || {}).args || {}).canary || {};
  const r = { attack: 'eventsource' };
  try {
    const es = new EventSource(canary.http + '/sse');
    es.onopen = () => { r.opened = true; window.bridge.emit('done', r); };
    es.onerror = () => { r.error = 'onerror'; es.close(); window.bridge.emit('done', r); };
    setTimeout(() => window.bridge.emit('done', { ...r, viaTimeout: true }), 1500);
  } catch (e) {
    r.threw = String(e);
    window.bridge.emit('done', r);
  }
</script>
