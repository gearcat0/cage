<!doctype html>
<meta charset="utf-8" />
<title>attack: thing:// outside the blob map</title>
<!-- ATTACK: ask the thing:// handler for content that was NOT supplied. The
     handler serves ONLY known bytes, so this must fail. Three vectors:
       1. fetch() of an unknown thing path (also blocked by connect-src),
       2. <img src> of an unknown thing path (img-src allows thing:, so this
          actually reaches the handler, which returns 404 -> onerror),
       3. a HAND-BUILT att/ URL on the thing's OWN id for a name that is not in
          its attachment table — the table + handler are the gate, not
          getBlob(), so this must 404 exactly like the others. -->
<script>
  const r = { attack: 'thing-unknown' };
  (async () => {
    try {
      const res = await fetch('thing://main/secret-not-supplied.json');
      r.fetchStatus = res.status;
      r.fetchOk = res.ok;
    } catch (e) {
      r.fetchError = String(e);
    }
    await new Promise((resolve) => {
      const img = new Image();
      img.onload = () => { r.imgLoaded = true; resolve(); };
      img.onerror = () => { r.imgError = true; resolve(); };
      img.src = 'thing://main/secret-not-supplied.png';
      setTimeout(resolve, 1000);
    });
    await new Promise((resolve) => {
      const img = new Image();
      img.onload = () => { r.attImgLoaded = true; resolve(); };
      img.onerror = () => { r.attImgError = true; resolve(); };
      // location.host is this thing's own id — the URL is well-formed and
      // reaches the handler; the unknown NAME is what must fail it.
      img.src = 'thing://' + location.host + '/att/not-in-the-table';
      setTimeout(resolve, 1000);
    });
    window.bridge.emit('done', r);
  })();
</script>
